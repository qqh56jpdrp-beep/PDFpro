<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF – PDFPro Tools</title>

<!-- pdf-lib (required for merging) -->
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
/* ---------------- GLOBAL THEME ---------------- */
:root{
  --bg: #f4f9ff;
  --card: rgba(255,255,255,0.6);
  --text: #0f172a;
  --muted: #607089;
  --blue1: #3b82f6;
  --blue2: #0ea5e9;
  --glass-border: rgba(255,255,255,0.45);
  --radius: 14px;
  --shadow: 0 8px 28px rgba(0,0,0,0.08);
}

body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(farthest-corner at 20% 20%, rgba(59,130,246,0.12), transparent),
              radial-gradient(farthest-corner at 90% 90%, rgba(14,165,233,0.10), transparent),
              var(--bg);
  color: var(--text);
  padding: 20px;
}

/* ---------------- HEADER ---------------- */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  margin-bottom:30px;
}

.logo{
  font-size: 1.5rem;
  font-weight:700;
  background: linear-gradient(135deg, var(--blue1), var(--blue2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

nav a{
  margin-left:20px;
  text-decoration:none;
  font-weight:600;
  color: var(--muted);
}
nav a:hover{ color: var(--blue1); }

/* ---------------- HERO SECTION ---------------- */
.hero{
  text-align:center;
  max-width:800px;
  margin:0 auto;
}

.hero h1{
  font-size:2.4rem;
  font-weight:800;
  margin-bottom:10px;
}

.hero p{
  font-size:1.1rem;
  color:var(--muted);
  margin-bottom:30px;
}

.upload-box{
  margin:40px auto;
  width:100%;
  max-width:650px;
  padding:50px 20px;
  border-radius:var(--radius);
  border:1px solid var(--glass-border);
  background: var(--card);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  text-align:center;
  cursor:pointer;
  transition:0.3s ease;
}

.upload-box:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 35px rgba(0,0,0,0.12);
}

button{
  padding:14px 32px;
  font-size:1rem;
  border: none;
  border-radius: var(--radius);
  cursor:pointer;
  background: linear-gradient(135deg, var(--blue1), var(--blue2));
  color:white;
  font-weight:600;
  box-shadow:0 6px 20px rgba(59,130,246,0.3);
  transition: .3s;
}
button:hover{
  opacity:0.9;
  transform:scale(1.03);
}

/* ---------------- FILE LIST ---------------- */
.file-list{
  max-width:650px;
  margin:20px auto;
  padding:0;
  list-style:none;
}

.file-item{
  padding:14px 18px;
  margin-bottom:12px;
  border-radius:var(--radius);
  background:white;
  border:1px solid #e5ecf5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.file-item span{ font-weight:600; }

.remove{
  color:#e11d48;
  cursor:pointer;
  font-weight:700;
}

/* ---------------- FOOTER ---------------- */
footer{
  text-align:center;
  margin-top:60px;
  color:var(--muted);
  font-size:0.9rem;
}
footer a{
  color:var(--blue1);
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<header>
  <div class="logo">PDFPro Tools</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Tools</a>
    <a href="#">Pricing</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Merge PDF Files Instantly</h1>
  <p>Combine multiple PDF documents into a single, clean file — fast, secure, and free.</p>
</section>

<!-- Upload Box -->
<label for="fileUpload">
  <div class="upload-box">
    <h2>Click here or Drop PDFs to Upload</h2>
    <p>(You can add multiple files)</p>
  </div>
</label>

<input type="file" id="fileUpload" accept="application/pdf" multiple style="display:none">

<ul class="file-list" id="fileList"></ul>

<div style="text-align:center; margin-top:30px;">
  <button id="mergeBtn">Merge PDF</button>
</div>

<footer>
  <p>
    <a href="#">About</a> • 
    <a href="#">Privacy Policy</a> • 
    <a href="#">Terms</a> • 
    <a href="#">Contact</a>
    <br><br>
    © 2025 PDFPro Tools — All rights reserved.
  </p>
</footer>

<script>
const fileUpload = document.getElementById("fileUpload");
const fileList = document.getElementById("fileList");

fileUpload.onchange = () => {
  fileList.innerHTML = "";
  [...fileUpload.files].forEach((file, i) => {
    let li = document.createElement("li");
    li.className = "file-item";
    li.innerHTML = `<span>${file.name}</span> <span class='remove' onclick="removeFile(${i})">✖</span>`;
    fileList.appendChild(li);
  });
};

function removeFile(index){
  const dt = new DataTransfer();
  [...fileUpload.files]
    .filter((_, i) => i !== index)
    .forEach(file => dt.items.add(file));
  fileUpload.files = dt.files;
  fileUpload.onchange();
}

/* ---------------- REAL MERGE FUNCTION ---------------- */
document.getElementById("mergeBtn").onclick = async () => {
  if (fileUpload.files.length === 0){
    alert("Please upload at least 2 PDF files.");
    return;
  }

  const { PDFDocument } = PDFLib;
  const mergedPdf = await PDFDocument.create();

  try{
    for (let file of fileUpload.files){
      const bytes = await file.arrayBuffer();
      const pdf = await PDFDocument.load(bytes);
      const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
      pages.forEach(p => mergedPdf.addPage(p));
    }

    const mergedBytes = await mergedPdf.save();
    const blob = new Blob([mergedBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "merged.pdf";
    a.click();

    URL.revokeObjectURL(url);

  } catch (err){
    console.error(err);
    alert("Error merging PDF files.");
  }
};
</script>

</body>
</html>
